name: Compilar APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Um build por vez: um envio novo cancela o build anterior que ainda estiver rodando.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Testes do núcleo XISO
        run: gradle --no-daemon :app:testDebugUnitTest

      # A chave vem dos Secrets do repositório e só existe durante este build.
      - name: Preparar chave de assinatura
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure os Secrets SIGNING_KEYSTORE_BASE64 e SIGNING_STORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Apagar a chave do servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk XisoKit.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: XisoKit-apk
          path: XisoKit.apk

      - name: Publicar "Build mais recente"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly XisoKit.apk \
            --title "Build mais recente" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "APK compilado a partir do commit ${GITHUB_SHA::7}."

      - name: Publicar versão (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" XisoKit.apk \
            --title "XisoKit $GITHUB_REF_NAME" \
            --generate-notes
