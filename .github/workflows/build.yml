name: Compilar APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Um build por vez: um envio novo cancela o build anterior que ainda estiver rodando.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # A plataforma 37.1 pode não vir na imagem do runner; o AGP não baixa sozinho.
      - name: Instalar plataforma 37.1
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1"

      - name: Testes do núcleo XISO
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      # Mesmo se o lint falhar, mostra os avisos no log.
      - name: Mostrar avisos do lint
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true

      # A chave vem dos Secrets do repositório e só existe durante este build.
      - name: Preparar chave de assinatura
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure os Secrets SIGNING_KEYSTORE_BASE64 e SIGNING_STORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Apagar a chave do servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk XisoKit.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: XisoKit-apk
          path: XisoKit.apk

      - name: Publicar "Build mais recente"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly XisoKit.apk \
            --title "Build mais recente" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "APK compilado a partir do commit ${GITHUB_SHA::7}."

      - name: Publicar versão (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rodar o workflow de novo numa tag não pode falhar por a release já existir.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" XisoKit.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" XisoKit.apk \
              --title "XisoKit $GITHUB_REF_NAME" \
              --generate-notes
          fi
